---
- name: Create CMaNGOS subdirs
  file:
    path: '{{ cmangos_dir }}'
    state: directory
    owner: '{{ CMANGOS_HOST_UID }}'
    group: '{{ CMANGOS_HOST_GID }}'
    mode: '0755'
  loop_control:
    loop_var: cmangos_dir
  loop:
    - '{{ CMANGOS_CONFIG_PATH }}'
    - '{{ CMANGOS_ASSETS_PATH }}'
    - '{{ CMANGOS_STORAGE_PATH }}'
    - '{{ CMANGOS_STORAGE_HONOR_PATH }}'
    - '{{ CMANGOS_LOGS_PATH }}'
    - '{{ CMANGOS_REALMD_LOGS_PATH }}'
    - '{{ CMANGOS_MANGOSD_LOGS_PATH }}'

- name: Apply CMaNGOS Compose template
  template:
    src: docker-compose.yml.j2
    dest: '{{ CMANGOS_DOCKER_PATH }}/docker-compose.yml'
    owner: '{{ CMANGOS_HOST_UID }}'
    group: '{{ CMANGOS_HOST_GID }}'
    mode: '0644'
  notify: Restart CMaNGOS

- name: Apply .env
  template:
    src: env.j2
    dest: '{{ CMANGOS_DOCKER_PATH }}/.env'
    owner: '{{ CMANGOS_HOST_UID }}'
    mode: '0600'
  notify: Restart CMaNGOS

- name: Apply realmd and mangosd config templates
  template:
    src: '{{ cmangos_default_config }}.j2'
    dest: '{{ CMANGOS_CONFIG_PATH }}/{{ cmangos_default_config }}'
    owner: '{{ CMANGOS_HOST_UID }}'
    group: '{{ CMANGOS_HOST_GID }}'
    mode: '0644'
  loop_control:
    loop_var: cmangos_default_config
  loop:
    - realmd.conf
    - mangosd.{{ CMANGOS_EXPANSION }}.conf
  notify: Restart CMaNGOS

- name: Apply ahbot and aiplayerbot config templates
  template:
    src: '{{ cmangos_bots_config }}.j2'
    dest: '{{ CMANGOS_CONFIG_PATH }}/{{ cmangos_bots_config }}'
    owner: '{{ CMANGOS_HOST_UID }}'
    group: '{{ CMANGOS_HOST_GID }}'
    mode: '0644'
  loop_control:
    loop_var: cmangos_bots_config
  loop:
    - ahbot.conf
    - aiplayerbot.{{ CMANGOS_EXPANSION }}.conf
  notify: Restart CMaNGOS
  when: CMANGOS_ENABLE_BOTS | default(false) | bool

- name: Deploy WoW client-data
  synchronize:
    src: '{{ CMANGOS_ASSETS_SRC }}/'
    dest: '{{ CMANGOS_ASSETS_PATH }}'
    delete: true
    archive: true
    rsync_opts:
      - --chmod=F0644,D0755
  notify: Restart CMaNGOS

- name: Fix owner and group after assets sync
  file:
    path: '{{ CMANGOS_ASSETS_PATH }}'
    owner: '{{ CMANGOS_HOST_UID }}'
    group: '{{ CMANGOS_HOST_GID }}'
    recurse: true
  become: true
