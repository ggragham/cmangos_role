---
- name: Install and configure CMaNGOS
  block:
    - name: Init tasks
      include_tasks: init.yml

    - name: Deploy CMaNGOS
      include_tasks: deploy.yml

    - name: Deploy Nginx
      include_tasks: nginx.yml
      when: CMANGOS_INSTALL_NGINX | default(false) | bool

    - name: Configure DB
      include_tasks: db.yml

  when: action is not defined

- name: Create realm account
  include_tasks: account.yml
  when: action | default('') == 'create_account'
