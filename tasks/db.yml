---
- name: Start DB service
  community.docker.docker_compose_v2:
    project_src: '{{ CMANGOS_DOCKER_PATH }}'
    services: '{{ CMANGOS_DB_SERVICE_NAME }}'
    state: present
    wait: true
    wait_timeout: 900

- name: Configure realmlist
  block:
    - name: Read rows count except id=1
      community.docker.docker_compose_v2_exec:
        project_src: '{{ CMANGOS_DOCKER_PATH }}'
        service: '{{ CMANGOS_DB_SERVICE_NAME }}'
        tty: false
        argv:
          - /bin/sh
          - -lc
          - '{{ CMANGOS_MARIADB_EXEC_CMD }}'
        stdin: |
          USE {{ CMANGOS_EXPANSION }}realmd;
          SELECT COUNT(*)
          FROM realmlist
          WHERE id <> 1;
      register: realmlist_extra_rows
      changed_when: false

    - name: Read row id=1 name and address if present
      community.docker.docker_compose_v2_exec:
        project_src: '{{ CMANGOS_DOCKER_PATH }}'
        service: '{{ CMANGOS_DB_SERVICE_NAME }}'
        tty: false
        argv:
          - /bin/sh
          - -lc
          - '{{ CMANGOS_MARIADB_EXEC_CMD }}'
        stdin: |
          USE {{ CMANGOS_EXPANSION }}realmd;
          SELECT CONCAT_WS('\t', COALESCE(name, ''), COALESCE(address, ''))
          FROM realmlist
          WHERE id = 1
          LIMIT 1;
      register: realmlist_row1
      changed_when: false

    - name: Parse current realmlist state
      set_fact:
        realmlist_extra_count: '{{ realmlist_extra_rows.stdout | trim | int }}'
        realmlist_row1_exists: '{{ (realmlist_row1.stdout | trim | length) > 0 }}'
        realmlist_row1_parts: "{{ (realmlist_row1.stdout | trim).split('\t') + ['', ''] }}"

    - name: Delete all rows except id=1
      community.docker.docker_compose_v2_exec:
        project_src: '{{ CMANGOS_DOCKER_PATH }}'
        service: '{{ CMANGOS_DB_SERVICE_NAME }}'
        tty: false
        argv:
          - /bin/sh
          - -lc
          - '{{ CMANGOS_MARIADB_EXEC_CMD }}'
        stdin: |
          USE {{ CMANGOS_EXPANSION }}realmd;
          DELETE FROM realmlist
          WHERE id <> 1;
      when: (realmlist_extra_count | int) > 0

    - name: Create row id=1 when row is absent
      community.docker.docker_compose_v2_exec:
        project_src: '{{ CMANGOS_DOCKER_PATH }}'
        service: '{{ CMANGOS_DB_SERVICE_NAME }}'
        tty: false
        argv:
          - /bin/sh
          - -lc
          - '{{ CMANGOS_MARIADB_EXEC_CMD }}'
        stdin: |
          USE {{ CMANGOS_EXPANSION }}realmd;
          INSERT INTO realmlist
            (id, name, address, port)
          VALUES
            (
              1,
              '{{ CMANGOS_MANGOSD_SERVER_NAME | replace("'", "''") }}',
              '{{ CMANGOS_DOMAIN | replace("'", "''") }}',
              8085
            );
      when: not (realmlist_row1_exists | bool)

    - name: Update row id=1 when name or address differ
      community.docker.docker_compose_v2_exec:
        project_src: '{{ CMANGOS_DOCKER_PATH }}'
        service: '{{ CMANGOS_DB_SERVICE_NAME }}'
        tty: false
        argv:
          - /bin/sh
          - -lc
          - '{{ CMANGOS_MARIADB_EXEC_CMD }}'
        stdin: |
          USE {{ CMANGOS_EXPANSION }}realmd;
          UPDATE realmlist
          SET
            name = '{{ CMANGOS_MANGOSD_SERVER_NAME | replace("'", "''") }}',
            address = '{{ CMANGOS_DOMAIN | replace("'", "''") }}'
          WHERE id = 1;
      when:
        - realmlist_row1_exists | bool
        - realmlist_row1_parts[0] != (CMANGOS_MANGOSD_SERVER_NAME | string) or realmlist_row1_parts[1] != (CMANGOS_DOMAIN | string)

    - name: Read resulting realmlist row
      community.docker.docker_compose_v2_exec:
        project_src: '{{ CMANGOS_DOCKER_PATH }}'
        service: '{{ CMANGOS_DB_SERVICE_NAME }}'
        tty: false
        argv:
          - /bin/sh
          - -lc
          - '{{ CMANGOS_MARIADB_EXEC_CMD }}'
        stdin: |
          USE {{ CMANGOS_EXPANSION }}realmd;
          SELECT CONCAT_WS(' | ', id, name, address, port)
          FROM realmlist
          WHERE id = 1
          LIMIT 1;
      register: realmlist_after
      changed_when: false

    - name: Show resulting realmlist row
      debug:
        var: realmlist_after.stdout_lines

- name: Disable default realm accounts
  block:
    - name: Prepare account disable SQL values
      set_fact:
        account_disable_usernames_count: '{{ CMANGOS_REALMD_DISABLE_ACCOUNTS | length }}'
        account_disable_usernames_sql: >-
          '{{ CMANGOS_REALMD_DISABLE_ACCOUNTS
              | map("string")
              | map("replace", "'", "''")
              | join("', '") }}'

    - name: Read target account ids
      community.docker.docker_compose_v2_exec:
        project_src: '{{ CMANGOS_DOCKER_PATH }}'
        service: '{{ CMANGOS_DB_SERVICE_NAME }}'
        tty: false
        argv:
          - /bin/sh
          - -lc
          - '{{ CMANGOS_MARIADB_EXEC_CMD }}'
        stdin: |
          USE {{ CMANGOS_EXPANSION }}realmd;
          SELECT COALESCE(GROUP_CONCAT(id ORDER BY id SEPARATOR ','), '')
          FROM account
          WHERE username IN ({{ account_disable_usernames_sql }});
      register: account_disable_ids
      changed_when: false
      when: (account_disable_usernames_count | int) > 0

    - name: Check whether target account ids exist
      set_fact:
        account_disable_target_ids_exist: '{{ (account_disable_ids.stdout | trim | length) > 0 }}'
      when: (account_disable_usernames_count | int) > 0

    - name: Ban target accounts
      community.docker.docker_compose_v2_exec:
        project_src: '{{ CMANGOS_DOCKER_PATH }}'
        service: '{{ CMANGOS_DB_SERVICE_NAME }}'
        tty: false
        argv:
          - /bin/sh
          - -lc
          - '{{ CMANGOS_MARIADB_EXEC_CMD }}'
        stdin: |
          USE {{ CMANGOS_EXPANSION }}realmd;
          INSERT INTO account_banned
            (account_id, banned_by, reason, active)
          SELECT
            a.id,
            '',
            '',
            1
          FROM account a
          LEFT JOIN account_banned ab
            ON ab.account_id = a.id
          AND ab.active = 1
          WHERE a.username IN ({{ account_disable_usernames_sql }})
            AND ab.account_id IS NULL;
          SELECT ROW_COUNT();
      register: account_disable_insert_result
      changed_when: >-
        {{
          (account_disable_insert_result.stdout_lines | last | trim | int) > 0
        }}
      when:
        - (account_disable_usernames_count | int) > 0
        - account_disable_target_ids_exist | bool

    - name: Read resulting banned accounts
      community.docker.docker_compose_v2_exec:
        project_src: '{{ CMANGOS_DOCKER_PATH }}'
        service: '{{ CMANGOS_DB_SERVICE_NAME }}'
        tty: false
        argv:
          - /bin/sh
          - -lc
          - '{{ CMANGOS_MARIADB_EXEC_CMD }}'
        stdin: |
          USE {{ CMANGOS_EXPANSION }}realmd;
          SELECT CONCAT_WS(' | ', a.id, a.username, ab.active)
          FROM account a
          INNER JOIN account_banned ab
            ON ab.account_id = a.id
          WHERE a.username IN ({{ account_disable_usernames_sql }})
            AND ab.active = 1
          ORDER BY a.id, ab.id DESC;
      register: account_disable_after
      changed_when: false
      when:
        - (account_disable_usernames_count | int) > 0
        - account_disable_target_ids_exist | bool
        - account_disable_insert_result.changed

    - name: Show resulting banned accounts
      debug:
        var: account_disable_after.stdout_lines
      when:
        - (account_disable_usernames_count | int) > 0
        - account_disable_target_ids_exist | bool
        - account_disable_insert_result.changed
