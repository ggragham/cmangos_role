---
CMANGOS_DOCKER_PATH: /opt/cmangos_docker  # CMaNGOS installation path.
CMANGOS_DOCKER_SERVICE_TIMEOUT: 10min  # CMaNGOS Docker service timeout.
CMANGOS_CONFIG_PATH: '{{ CMANGOS_DOCKER_PATH }}/config'  # CMaNGOS configs path.
CMANGOS_NGINX_SSL_PATH: '{{ CMANGOS_DOCKER_PATH }}/ssl'  # CMaNGOS Nginx SSL certificates path.
CMANGOS_ASSETS_PATH: '{{ CMANGOS_DOCKER_PATH }}/assets'  # CMaNGOS assets path.
CMANGOS_STORAGE_PATH: '{{ CMANGOS_DOCKER_PATH }}/storage'  # CMaNGOS storage path.
CMANGOS_STORAGE_HONOR_PATH: '{{ CMANGOS_STORAGE_PATH }}/honor'  # CMaNGOS honor storage path.
CMANGOS_LOGS_PATH: '{{ CMANGOS_DOCKER_PATH }}/logs'  # CMaNGOS logs path.
CMANGOS_NGINX_LOGS_PATH: '{{ CMANGOS_LOGS_PATH }}/nginx'  # CMaNGOS Nginx logs path.
CMANGOS_REALMD_LOGS_PATH: '{{ CMANGOS_LOGS_PATH }}/realmd'  # CMaNGOS realmd logs path.
CMANGOS_MANGOSD_LOGS_PATH: '{{ CMANGOS_LOGS_PATH }}/mangosd'  # CMaNGOS mangosd logs path.
CMANGOS_SERVICE_NAME: cmangos-{{ CMANGOS_EXPANSION }}  # CMaNGOS service name.
CMANGOS_DB_SERVICE_NAME: '{{ CMANGOS_SERVICE_NAME }}-db'  # CMaNGOS DB service name.
CMANGOS_REALMD_SERVICE_NAME: '{{ CMANGOS_SERVICE_NAME }}-realmd'  # CMaNGOS realmd service name.
CMANGOS_MANGOSD_SERVICE_NAME: '{{ CMANGOS_SERVICE_NAME }}-mangosd'  # CMaNGOS mangosd service name.
CMANGOS_PHPMYADMIN_SERVICE_NAME: phpmyadmin  # phpMyAdmin service name.
CMANGOS_NGINX_SERVICE_NAME: nginx  # Nginx service name.

# CMaNGOS realm domain.
CMANGOS_REALM_DOMAIN: >-
  {{
    CMANGOS_DOMAIN
    if CMANGOS_DOMAIN is match('^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$')
    else 'realm.' ~ CMANGOS_DOMAIN
  }}

# Command to execute MariaDB with user credentials and settings.
CMANGOS_MARIADB_EXEC_CMD: >-
  exec mariadb
  -u{{ CMANGOS_DB_USERNAME }}
  -p"{{ CMANGOS_DB_PASSWORD }}"
  --batch
  --raw
  --skip-column-names

# List of default accounts to disable.
CMANGOS_REALMD_DISABLE_ACCOUNTS:
  - ADMINISTRATOR
  - GAMEMASTER
  - MODERATOR
  - PLAYER
